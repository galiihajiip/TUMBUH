services:
  app:
    build: .
    image: tumbuh-app
    container_name: tumbuh
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      APP_URL: "${APP_URL:-http://localhost:${APP_PORT:-8000}}"
      APP_PORT: "${APP_PORT:-8000}"
      TUMBUH_DEMO_MODE: "true"
    volumes:
      # SQLite database + uploads persist across restarts.
      - tumbuh-data:/var/www/html/storage/app
    restart: unless-stopped

volumes:
  tumbuh-data:
